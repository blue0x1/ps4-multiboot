# PS4 Liverpool/Gladius GPU: stock Mesa has no 3D support for it, so glamor
# acceleration would fail. Use the kernel modesetting driver with software
# rendering (shadow framebuffer). Only used by the desktop profile.
Section "Device"
    Identifier "PS4 GPU"
    Driver     "modesetting"
    Option     "AccelMethod" "none"
    Option     "ShadowFB"    "true"
EndSection
